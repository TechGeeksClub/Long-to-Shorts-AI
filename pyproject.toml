[project]
name = "long-to-shorts"
version = "0.1.0"
description = "Yerel uzun videolardan altyazili kisa videolar ureten web uygulamasi"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "faster-whisper>=1.2,<2",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.11,<5",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
